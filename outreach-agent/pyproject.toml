[project]
name = "outreach-agent"
version = "0.1.0"
description = "Autonomous outreach agent for PlotLot — cold email, LinkedIn, Twitter, and event discovery"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "aiosmtplib>=3.0",
    "httpx>=0.27",
    "playwright>=1.47",
    "tweepy>=4.14",
    "jinja2>=3.1",
    "structlog>=24.0",
    "tenacity>=8.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
outreach = "outreach.cli:main"
outreach-scout = "outreach.cli:scout_main"
outreach-email = "outreach.cli:email_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
ignore_missing_imports = true
