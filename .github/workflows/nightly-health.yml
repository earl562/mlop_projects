name: Nightly Health

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-health
  cancel-in-progress: false

jobs:
  deployed-api-health:
    name: Deployed API Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check deployed PlotLot health endpoint
        env:
          PLOTLOT_HEALTH_URL: ${{ vars.PLOTLOT_HEALTH_URL }}
          PLOTLOT_HEALTH_ATTEMPTS: "3"
          PLOTLOT_HEALTH_TIMEOUT_SECONDS: "8"
          PLOTLOT_HEALTH_BACKOFF_SECONDS: "2"
        run: PYTHONPATH=plotlot/src python3 -m plotlot.health.probes

  live-provider-health:
    name: Live Provider Health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plotlot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: plotlot/uv.lock
      - run: uv sync --frozen --extra dev --extra eval
      - run: >-
          uv run python -m pytest
          tests/integration/test_hub_live.py
          tests/integration/test_universal_validation.py
          -m live -v --tb=short
