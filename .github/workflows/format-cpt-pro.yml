name: Format CPT PRO branch

on:
  push:
    branches:
      - feat/plotlot-production-agentic-harness-mvp
    paths:
      - .github/workflows/format-cpt-pro.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Apply Ruff formatting baseline
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
      - name: Format Python source and tests
        run: uvx --from ruff==0.15.1 ruff format plotlot/src plotlot/tests
      - name: Commit formatting-only changes
        shell: bash
        run: |
          if git diff --quiet -- plotlot/src plotlot/tests; then
            echo "Ruff formatting is already current."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plotlot/src plotlot/tests
          git commit -m "style: apply Ruff formatting baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
